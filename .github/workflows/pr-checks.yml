name: Pull Request Quality Checks

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  inspect:
    name: inspect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed files
        run: |
          echo "Pull request: ${{ github.event.pull_request.number }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" || true
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    needs: inspect
    steps:
      - name: Confirm quality gate
        run: echo "Required PR quality gate passed. Review the validation workflow before merging."
