name: Validate HTML, CSS, JavaScript & README

on:
  push:
    branches: [main, develop, 'feature/**', 'ci/**', 'theme/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install validation tools
        run: npm install -g htmlhint csslint

      - name: Validate HTML
        run: htmlhint "*.html" --config .htmlhintrc

      - name: Validate CSS
        run: csslint css/*.css --quiet

      - name: Check JavaScript syntax
        run: |
          for f in js/*.js; do node --check "$f"; done

      - name: Check README exists
        run: test -s README.md