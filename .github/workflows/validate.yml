name: Validate HTML & CSS

on:
  push:
    branches: [main, develop, 'feature/**', 'ci/**', 'theme/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install HTML and CSS linters
        run: npm install --no-save htmlhint stylelint stylelint-config-standard
      - name: Validate HTML
        run: npx htmlhint index.html
      - name: Validate CSS
        run: npx stylelint 'css/**/*.css'
